<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="radar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bg-grad)"/>

  <!-- Subtle Circular Radar Grid -->
  <circle cx="200" cy="190" r="130" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="200" cy="190" r="90" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.3"/>
  <circle cx="200" cy="190" r="50" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.4"/>

  <!-- Shield Shape -->
  <path d="M 200,60 
           C 270,60 310,80 310,130 
           C 310,230 240,290 200,315 
           C 160,290 90,230 90,130 
           C 90,80 130,60 200,60 Z" 
        fill="url(#shield-grad)" 
        opacity="0.9"
        filter="url(#glow)"/>

  <!-- Inner Shield Inset -->
  <path d="M 200,80 
           C 255,80 288,96 288,138 
           C 288,220 232,270 200,292 
           C 168,270 112,220 112,138 
           C 112,96 145,80 200,80 Z" 
        fill="#0f172a" 
        opacity="0.92"/>

  <!-- Freshness Pulse / Checkmark & Lightning Icon -->
  <path d="M 160,190 L 188,218 L 245,155" 
        fill="none" 
        stroke="url(#radar-grad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Stale-Radar Crosshairs -->
  <circle cx="245" cy="155" r="5" fill="#38bdf8"/>
  <circle cx="160" cy="190" r="4" fill="#10b981"/>

  <!-- Text Label -->
  <text x="200" y="360" text-anchor="middle" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="2">
    de<tspan fill="#38bdf8">STALE</tspan>
  </text>
</svg>
